<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>


    <!-- J.A.R.V.I.S CORE -->
    <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>
    </div>

    <p class="core-text">SYSTEM READY</p>


    <!-- SYSTEM DIAGNOSTICS -->
    <section class="status">

        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="row">
            <span>AI ENGINE</span>
            <b class="on">• OPERATIONAL</b>
        </div>

        <div class="row">
            <span>CONNECTION</span>
            <b class="on">• ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE INTERFACE</span>
            <b class="on">• READY</b>
        </div>

        <div class="row">
            <span>LONG-TERM MEMORY</span>
            <b class="on">• ACTIVE</b>
        </div>

    </section>


    <!-- CHAT -->
    <section
        class="chat"
        id="chat"
        aria-live="polite"
    ></section>


    <!-- INPUT AREA -->
    <div class="input-area">

        <input
            id="msg"
            type="text"
            placeholder="Enter a command for J.A.R.V.I.S..."
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
        >
            EXECUTE
        </button>

        <button
            id="mic-btn"
            type="button"
            aria-label="Activate voice input"
        >
            🎤
        </button>

        <button
            id="cam-btn"
            type="button"
            aria-label="Analyze image"
        >
            📷
        </button>

        <button
            id="clear-btn"
            type="button"
        >
            CLEAR MEMORY
        </button>

        <input
            id="img-input"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
        >

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js?v=episode7-clean"></script>

</body>
</html>
